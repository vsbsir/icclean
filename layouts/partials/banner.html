<!-- Banner -->
<section class="banner {{ .style }}">
    <div class="content">
        {{ with .title }}
        <div class="logo-lockup">
            <img src="{{ "images/logo-img.svg" | relURL }}" alt="ICCLEAN logo" class="logo-mark" />
            <h1>{{ . }}</h1>
        </div>
        {{ end }}
        {{ with .subtitle }}<p class="major">{{ . | safeHTML }}</p>{{ end }}
        {{ with .content }}<p>{{ . | safeHTML }}</p>{{ end }}
        {{ with .button }}<ul class="actions stacked">
            <li><a href="#first" class="button primary large wide banner-cta">{{ .label }}</a></li>
        </ul>{{ end }}
    </div>
    {{ with .image }}<div class="image">
        <img src="{{.}}" alt="Hugo Story" />
    </div>{{end}}
</section>
