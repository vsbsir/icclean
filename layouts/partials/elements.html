                            <!-- Form -->
                                <section class="wrapper style1 align-center">
                    <div class="inner">
                                    <header>
                                        <h3 id="contact">Contact Us</h3>
                                    </header>
                                    <div class="content">

                                        <form method="post" action="#">
                                            <div class="fields">
                                                <div class="field half">
                                                    <label for="name">Name</label>
                                                    <input type="text" name="name" id="name" value="" />
                                                </div>
                                                <div class="field half">
                                                    <label for="email">Email</label>
                                                    <input type="email" name="email" id="email" value="" />
                                                </div>
                                                <div class="field">
                                                    <label for="department">Department</label>
                                                    <select name="department" id="department">
                                                        <option value="">- Category -</option>
                                                        <option value="1">General Cleaning</option>
                                                        <option value="2">Deap Cleaning</option>
                                                        <option value="3">Move In/Out</option>
                                                    </select>
                                                </div>
                                                <div class="field third">
                                                    <input type="radio" id="priority-low" name="priority" checked />
                                                    <label for="priority-low">Low Priority</label>
                                                </div>
                                                <div class="field third">
                                                    <input type="radio" id="priority-normal" name="priority" />
                                                    <label for="priority-normal">Normal Priority</label>
                                                </div>
                                                <div class="field third">
                                                    <input type="radio" id="priority-high" name="priority" />
                                                    <label for="priority-high">High Priority</label>
                                                </div>
                                                <div class="field">
                                                    <label for="message">Message</label>
                                                    <textarea name="message" id="message" rows="6" placeholder="in here put a sample with the type of details you want"></textarea>
                                                </div>
                                                <div class="field half">
                                                    <input type="checkbox" id="copy" name="copy" />
                                                    <label for="copy">Email me a copy of this message</label>
                                                </div>
                                                <div class="field half">
                                                    <input type="checkbox" id="human" name="human" checked />
                                                    <label for="human">I am a human and not a robot</label>
                                                </div>
                                            </div>
                                            <ul class="actions">
                                                <li><input type="submit" name="submit" id="submit" value="Send Message" /></li>
                                            </ul>
                                        </form>

                                    </div>
                                </section>
