<!-- General Contact -->
<section class="wrapper style1 align-center" id="contact">
  <div class="inner">
    <header>
      <h2>Still Have Questions?</h2>
      <p>Not sure which service you need, or just want to check if we cover your area? Send us a message and we'll get back to you within a few hours.</p>
    </header>
    <div class="content">

      <form method="post" action="https://formspree.io/f/YOUR_FORM_ID">

        <!-- Honeypot spam trap -->
        <input type="text" name="_gotcha" style="display:none" />

        <div class="fields">
          <div class="field half">
            <label for="name">Name</label>
            <input type="text" name="name" id="name" required />
          </div>
          <div class="field half">
            <label for="email">Email</label>
            <input type="email" name="email" id="email" required />
          </div>
          <div class="field half">
            <label for="phone">Phone (optional)</label>
            <input type="tel" name="phone" id="phone" />
          </div>
          <div class="field">
            <label for="message">Message</label>
            <textarea name="message" id="message" rows="6"
              placeholder="Tell us a bit about what you're looking for — we're happy to help point you in the right direction."></textarea>
          </div>
        </div>

        <ul class="actions special">
          <li><input type="submit" value="Send Message" /></li>
        </ul>

      </form>

    </div>
  </div>
</section>
