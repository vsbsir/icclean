<section class="wrapper style1 align-center">
  <div class="inner">
    <header>
      <h2 id="contact">Let's Get Your Home Clean.</h2>
      <p>Fill out the form below and we'll get back to you within a few hours.<br>No automated replies — just a real person ready to help.</p>
    </header>
    <div class="content">

      <form method="post" action="https://formspree.io/f/YOUR_FORM_ID">

        <!-- Honeypot spam trap -->
        <input type="text" name="_gotcha" style="display:none" />

        <div class="fields">
          <div class="field half">
            <label for="name">Name</label>
            <input type="text" name="name" id="name" required />
          </div>
          <div class="field half">
            <label for="email">Email</label>
            <input type="email" name="email" id="email" required />
          </div>
          <div class="field half">
            <label for="phone">Phone (optional)</label>
            <input type="tel" name="phone" id="phone" />
          </div>
          <div class="field half">
            <label for="service">Service</label>
            <select name="service" id="service">
              <option value="">— Select a service —</option>
              <option value="house-condo">House / Condo Cleaning</option>
              <option value="deep-cleaning">Deep Cleaning</option>
              <option value="move-in-out">Move In / Out</option>
              <option value="post-renovation">Post-Renovation</option>
              <option value="not-sure">Not sure yet</option>
            </select>
          </div>
          <div class="field">
            <label for="message">Message</label>
            <textarea name="message" id="message" rows="6"
              placeholder="Tell us a bit about your home — size, location, and anything specific you'd like us to know."></textarea>
          </div>
        </div>

        <ul class="actions special">
          <li><input type="submit" value="Send Message" /></li>
        </ul>

      </form>

    </div>
  </div>
</section>
