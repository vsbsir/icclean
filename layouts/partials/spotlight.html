<!-- Spotlight -->
<section class="spotlight {{ .style }}"{{ with .id }} id="{{ . }}"{{ end }}>
    <div class="content">
        {{ with .title }}<h2>{{ . }}</h2>{{ end }}
        {{ with .content }}<p>{{ . | safeHTML }}</p>{{ end }}
        {{ with .button }}<ul class="actions stacked">
            <li><a href="#" class="button quote-toggle" data-service="{{ $.title }}">{{ .label }}</a></li>
        </ul>{{ end }}
    </div>
    {{ with .image }}<div class="image">
        <img src="{{ . }}" alt="" />
    </div>{{ end }}
</section>
{{ with .button }}
{{ with $.title }}
<div class="quote-form-section" style="display:none;">
  <div class="quote-form-inner">
    <button class="quote-close">Close &times;</button>
    <h3>Get a Quote — {{ . }}</h3>
    <form method="post" action="https://formspree.io/f/YOUR_FORM_ID">
      <input type="hidden" name="service" value="{{ . }}" />
      <input type="text" name="_gotcha" style="display:none" />
      <div class="fields">
        <div class="field half">
          <label for="quote-name-{{ . }}">Name</label>
          <input type="text" name="name" id="quote-name-{{ . }}" required />
        </div>
        <div class="field half">
          <label for="quote-email-{{ . }}">Email</label>
          <input type="email" name="email" id="quote-email-{{ . }}" required />
        </div>
        <div class="field half">
          <label for="quote-phone-{{ . }}">Phone (optional)</label>
          <input type="tel" name="phone" id="quote-phone-{{ . }}" />
        </div>
        <div class="field">
          <label for="quote-message-{{ . }}">Message</label>
          <textarea name="message" id="quote-message-{{ . }}" rows="5"
            placeholder="Tell us a bit about your home — size, location, and anything specific you'd like us to know."></textarea>
        </div>
      </div>
      <ul class="actions special">
        <li><input type="submit" value="Send Request" /></li>
      </ul>
    </form>
  </div>
</div>
{{ end }}
{{ end }}
