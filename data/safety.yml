title: "👋 Safety & Insurance"
subtitle: ""

quotes:
  - text: >
      <p>**Is IC Clean insured?**</p>
      <p>Yes, fully insured. A certificate of insurance is available upon request — just ask.</p>

  - text: >
      <p>**Can I trust your team in my home?**</p>
      <p>We take this seriously. IC Clean is a small, personal team with a consistent standard of care — whoever shows up at your door. We treat every home with the same respect and attention we'd want for our own.</p>

  - text: >
      <p>**What if something gets damaged during the clean?**</p>
      <p>In the unlikely event that something is damaged, we are fully insured and will handle it professionally and transparently. Your peace of mind matters to us.</p>

