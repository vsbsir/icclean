title: "👋 FAQ SECTION"
subtitle: "Booking & Scheduling"

quotes:
  - text: >
      <p>**How do I book a cleaning?**</p>
      <p>Simple — just reach out through our contact form or give us a call. We'll get back to you promptly to confirm the details, walk you through the service, and lock in a date and time that works for you.</p>

  - text: >
      <p>**How far in advance do I need to book?**</p>
      <p>We recommend reaching out as early as possible to secure your preferred date, especially for deep cleaning, move-in/out, and post-renovation services which require a larger team.</p>

  - text: >
      <p>**Do I need to be home during the cleaning?**</p>
      <p>For the first clean, yes — and honestly, we think it's a good idea regardless. Meeting the team that comes into your home lets you put a face to the name, ask any questions, and feel confident about who you're welcoming through your door. It also means we can do a walk-through together at the start to make sure we're aligned on your expectations, and another one at the end to make sure you're happy with the results. After that first visit, we're happy to work out whatever arrangement is most convenient for you.</p>

  - text: >
      <p>**What if I need to cancel or reschedule?**</p>
      <p>We get it — life happens. Just reach out as soon as you know and we'll work with you to find a new time. We only ask for reasonable notice so we can adjust our team's schedule accordingly.</p>

  - text: >
      <p>**What if I'm not satisfied with the clean?**</p>
      <p>We do a walk-through inspection with you at the end of every clean for exactly this reason. If something isn't right, we'd rather know on the spot and fix it than have you unhappy. Your satisfaction is the whole point.</p>

