title: Why Choose IC Clean
intro: ""

items:
  - term: "🤝 Small & Personal"
    description: >
      You're not a ticket number. We're a small, personal team and every
      booking is handled with the same attention and care from start to finish.

  - term: "🏠 Your Home, Our Standard"
    description: >
      We treat every home as if it were our own — with care, attention to
      detail, and full respect for your space and belongings.

  - term: "🌬️ HEPA-Filter Vacuums"
    description: >
      We don't just move dust around. Our HEPA-filter vacuums capture fine
      particles and allergens, leaving your home genuinely clean and healthy.

  - term: "✅ Walk-Through Guarantee"
    description: >
      Every clean ends with an inspection — together with you. If something
      isn't right, we make it right. Simple as that.

  - term: "🛡️ Fully Insured"
    description: >
      Peace of mind comes standard. IC Clean is fully insured, and a
      certificate is available upon request.
