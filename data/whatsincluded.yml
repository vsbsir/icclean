title: "👋 What's Included"
subtitle: "/ Add-Ons"

quotes:
  - text: >
      <p>**What's included in a regular cleaning?**</p>
      <p>Our regular service covers all the essentials — dusting, vacuuming, mopping, kitchen and bathroom cleaning, light switches, baseboards, and more. Check our Services page for the full breakdown.</p>

  - text: >
      <p>**Can I request extra tasks not listed in the standard service?**</p>
      <p>Absolutely. Our service lists are a starting point, not a ceiling. If you have specific areas or tasks you'd like us to focus on, just let us know when booking and we'll make it happen.</p>

  - text: >
      <p>**Do you offer add-ons?**</p>
      <p>Yes! Depending on the service, add-ons include fridge and oven cleaning, inside cabinets, interior windows, and more. Just ask and we'll tailor the clean to your needs.</p>

