title: "Our Work"
style: "style2 medium lightbox onscroll-fade-in"
content: |
  A look at some of the spaces we've cleaned.
pictures:
  - title: "From Grease to Gleam"
    content: "No oven is too far gone — we get into every corner, rack, and surface until it looks like new."
    image: "images/gallery/fulls/icc1.webp"
    thumb: "images/gallery/thumbs/icc1.webp"
    button: "View"
  - title: "The Details Others Miss"
    content: "Light switches are touched dozens of times a day and rarely cleaned. We notice the things others skip."
    image: "images/gallery/fulls/icc2.webp"
    thumb: "images/gallery/thumbs/icc2.webp"
    button: "View"
  - title: "Dust Doesn't Stand a Chance"
    content: "Even the spots you never think to look at — our HEPA-filter vacuums and attention to detail make sure no dust gets left behind."
    image: "images/gallery/fulls/icc3.webp"
    thumb: "images/gallery/thumbs/icc3.webp"
    button: "View"
  - title: "Inside and Out"
    content: "Cabinets take a lot of daily wear. We clean every angle — top, bottom, and everything in between."
    image: "images/gallery/fulls/icc4.webp"
    thumb: "images/gallery/thumbs/icc4.webp"
    button: "View"
  - title: "Mildew, Meet Your Match"
    content: "Mildew buildup in caulking is one of the toughest things to tackle — and one of our specialties."
    image: "images/gallery/fulls/icc5.webp"
    thumb: "images/gallery/thumbs/icc5.webp"
    button: "View"
