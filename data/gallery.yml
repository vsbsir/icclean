title: "Gallery"
style: "style2 medium lightbox onscroll-fade-in"
content: |
  At IC Clean we pride ourselves on a job well done. That's why we revew all works with our client to insure a positive outcome.
pictures:
  - title: "From Grease to Gleam"
    content: "No oven is too far gone. We get into every corner, rack, and surface until it looks like new."
    image: "images/gallery/fulls/icc1.jpg"
    thumb: "images/gallery/thumbs/icc1.jpg"
    button: "Details"

  - title: "The Details Others Miss"
    content: "Light switches are touched dozens of times a day — and rarely cleaned. We notice the things others skip."
    image: "images/gallery/fulls/icc2.jpg"
    thumb: "images/gallery/thumbs/icc2.jpg"
    button: "Details"

  - title: "Dust Doesn't Stand a Chance"
    content: "Even the spots you never think to look at. Our HEPA-filter vacuums and attention to detail make sure no dust gets left behind."
    image: "images/gallery/fulls/icc3.jpg"
    thumb: "images/gallery/thumbs/icc3.jpg"
    button: "Details"

  - title: "Inside and Out"
    content: "Cabinets take a lot of daily wear. We clean every angle — top, bottom, and everything in between."
    image: "images/gallery/fulls/icc4.jpg"
    thumb: "images/gallery/thumbs/icc4.jpg"
    button: "Details"

  - title: "Mildew Meet Your Match"
    content: "Mildew buildup in caulking is one of the toughest things to tackle — and one of our specialties. We restore it so your bathroom feels truly clean again."
    image: "images/gallery/fulls/icc5.jpg"
    thumb: "images/gallery/thumbs/icc5.jpg"
    button: "Details"
    
   
